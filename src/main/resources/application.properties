spring.application.name=prospin-backend
server.port=${PORT:8080}

# Base de datos H2 en archivo (desarrollo). Para RDS usa el perfil "mysql".
spring.datasource.url=jdbc:h2:file:./data/prospin
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seguridad JWT (cambiar JWT_SECRET en cualquier entorno real; mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-32-caracteres-o-mas}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Orígenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# Usuarios de demostración que se crean al iniciar la primera vez
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin12345}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:Vendedor123}
app.seed.cliente-password=${SEED_CLIENTE_PASSWORD:Cliente123}

springdoc.swagger-ui.path=/swagger-ui.html
