spring.application.name=prospin-backend
server.port=${PORT:8080}

# Base de datos H2 en archivo (desarrollo). Para RDS usa el perfil "mysql".
spring.datasource.url=jdbc:h2:file:./data/prospin
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Seguridad JWT (cambiar JWT_SECRET en cualquier entorno real; mínimo 32 caracteres)
app.jwt.secret=${JWT_SECRET:cambia-esta-clave-secreta-por-una-de-32-caracteres-o-mas}
app.jwt.expiracion-minutos=${JWT_EXPIRACION_MINUTOS:60}

# Orígenes permitidos para el frontend (separados por coma)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5500,http://127.0.0.1:5500,http://localhost:8080}

# Usuarios de demostración que se crean al iniciar la primera vez
app.seed.admin-password=${SEED_ADMIN_PASSWORD:Admin12345}
app.seed.vendedor-password=${SEED_VENDEDOR_PASSWORD:Vendedor123}
app.seed.cliente-password=${SEED_CLIENTE_PASSWORD:Cliente123}

springdoc.swagger-ui.path=/swagger-ui.html

# Webpay Plus (Transbank): ambiente de integración con credenciales públicas de prueba
webpay.base-url=${WEBPAY_BASE_URL:https://webpay3gint.transbank.cl}
webpay.commerce-code=${WEBPAY_COMMERCE_CODE:597055555532}
webpay.api-secret=${WEBPAY_API_SECRET:579B532A7440BB0C9079DED94D31EA1615BACEB56610332264630D42D0A36B1C}

# Correos (Gmail por SMTP). Credenciales por variables de entorno, con contraseña de aplicación.
app.mail.enabled=${MAIL_ENABLED:false}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
